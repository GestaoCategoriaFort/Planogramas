<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planogramas · Fort Atacadista</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231F497D'/%3E%3Cg stroke='%23e6b94e' stroke-width='11'%3E%3Cline x1='18' y1='82' x2='82' y2='18'/%3E%3Cline x1='42' y1='96' x2='96' y2='42'/%3E%3Cline x1='4' y1='58' x2='58' y2='4'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#1F497D; --brand-d:#163a66; --brand-tint:rgba(31,73,125,.09);
    --fort-red:#e30613; --fort-yellow:#ffd200; --gold:#d8b45a;
    --bg:#f2f4f7; --card:#ffffff; --text:#1b232c; --muted:#657283;
    --border:#e6ebf1; --shadow:0 1px 2px rgba(20,30,45,.06),0 8px 24px rgba(20,30,45,.06);
    --radius:16px; --skel:#eef1f5;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f151c; --card:#18212c; --text:#e9eef4; --muted:#9aa8b8;
           --border:#26313f; --brand-tint:rgba(90,140,205,.16); --skel:#20293480;
           --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Inter',system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--text);
       -webkit-font-smoothing:antialiased;line-height:1.45;}

  /* ---------- Cabeçalho (Inteligência Comercial) ---------- */
  .topbar{background:var(--brand);color:#fff;box-shadow:0 3px 16px rgba(20,30,45,.18);
          position:sticky;top:0;z-index:10;}
  .bar-in{max-width:1000px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .brand-left{display:flex;align-items:center;gap:16px;border:1.5px solid var(--gold);
       border-radius:12px;padding:10px 20px 10px 12px}
  .stripes{flex:0 0 auto;width:74px;height:74px;border-radius:12px;
       background:repeating-linear-gradient(48deg,var(--brand) 0 9px,#e6b94e 9px 20px)}
  .head-txt{display:flex;flex-direction:column;gap:9px}
  .head-txt h1{margin:0;font-family:'Montserrat';font-weight:700;font-size:1.55rem;letter-spacing:-.3px;color:#fff;line-height:1.05;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .head-txt h1 .loja{font-size:.82rem;font-weight:800;letter-spacing:.5px;color:#1b232c;
       background:var(--gold);padding:3px 11px;border-radius:20px;white-space:nowrap}
  .ic-label{display:flex;align-items:center;gap:8px;font-family:'Montserrat';font-weight:700;
       font-size:.62rem;letter-spacing:2.5px;color:#cdd7e6}
  .ic-label .bars{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
  .ic-label .bars i{width:3px;background:var(--gold);border-radius:1px}
  .ic-label .bars i:nth-child(1){height:6px}.ic-label .bars i:nth-child(2){height:11px}
  .ic-label .bars i:nth-child(3){height:8px}.ic-label .bars i:nth-child(4){height:14px}
  .logos{margin-left:auto;display:flex;align-items:center}
  .logo-img{height:52px;width:auto;display:none}
  .wordmark{display:flex;align-items:center;gap:14px;color:#e2e8f2}
  .wordmark .grp{display:flex;flex-direction:column;line-height:1;font-family:'Montserrat';text-align:right}
  .wordmark .grp small{font-size:.58rem;letter-spacing:2px;font-weight:600;opacity:.85}
  .wordmark .grp b{font-size:1.15rem;letter-spacing:1px;font-weight:800}
  .wordmark .sep{width:1px;height:38px;background:rgba(255,255,255,.35)}
  .wordmark .fort{font-family:'Montserrat';font-weight:800;font-style:italic;font-size:1.35rem;letter-spacing:-.5px;text-align:center}
  .wordmark .fort b{display:block;font-style:normal;font-size:.6rem;letter-spacing:2px;margin-top:1px}

  /* ---------- Barra de busca ---------- */
  .toolbar{max-width:1000px;margin:20px auto 0;padding:0 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .search{position:relative;flex:1 1 260px}
  .search .ic-s{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}
  input[type=search]{width:100%;padding:13px 42px 13px 42px;font-size:1rem;border:1px solid var(--border);
       border-radius:12px;background:var(--card);color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s;
       -webkit-appearance:none}
  input[type=search]::-webkit-search-cancel-button{display:none}
  input[type=search]:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint)}
  .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:transparent;
       color:var(--muted);font-size:1.3rem;line-height:1;cursor:pointer;display:none;padding:4px 8px;border-radius:8px}
  .clear:hover{background:var(--brand-tint);color:var(--text)}
  .count{font-size:.85rem;color:var(--muted);white-space:nowrap;font-weight:600;
       background:var(--card);border:1px solid var(--border);padding:7px 14px;border-radius:20px}

  /* ---------- Lista ---------- */
  main{max-width:1000px;margin:16px auto 40px;padding:0 20px}
  .cat{font-family:'Montserrat';font-weight:800;font-size:.78rem;letter-spacing:1px;color:var(--brand);
       text-transform:uppercase;display:flex;align-items:center;gap:12px;margin:26px 2px 12px}
  .cat:first-child{margin-top:8px}
  @media (prefers-color-scheme: dark){ .cat{color:#9cc2f0} }
  .cat .line{flex:1;height:2px;background:var(--brand-tint);border-radius:2px}
  .cat .n{font-family:'Inter';font-size:.72rem;font-weight:700;color:var(--muted);
       background:var(--brand-tint);padding:2px 10px;border-radius:20px}
  .list{display:flex;flex-direction:column;gap:11px}
  a.item{display:flex;align-items:center;gap:15px;background:var(--card);border:1px solid var(--border);
       border-radius:var(--radius);padding:15px 16px;text-decoration:none;color:var(--text);box-shadow:var(--shadow);
       transition:transform .1s ease,border-color .15s ease;position:relative;overflow:hidden}
  a.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--brand);
       opacity:0;transition:opacity .15s}
  a.item:hover{transform:translateY(-2px);border-color:var(--brand)}
  a.item:hover::before{opacity:1}
  a.item:active{transform:translateY(0)}
  .pdf-ic{flex:0 0 auto;width:46px;height:46px;border-radius:11px;
       background:linear-gradient(135deg,var(--brand),var(--brand-d));
       color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.72rem;
       letter-spacing:.5px;font-family:'Montserrat';box-shadow:0 4px 10px rgba(31,73,125,.28)}
  .meta{flex:1 1 auto;min-width:0}
  .name{font-weight:600;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .subline{display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap}
  .date-chip{font-size:.72rem;font-weight:600;color:var(--brand);background:var(--brand-tint);
       padding:2px 9px;border-radius:20px}
  @media (prefers-color-scheme: dark){ .date-chip{color:#9cc2f0} }
  .size{color:var(--muted);font-size:.8rem}
  .tag{flex:0 0 auto;font-family:'Montserrat';font-weight:800;font-size:.6rem;letter-spacing:1px;
       padding:3px 8px;border-radius:20px;white-space:nowrap}
  .tag.novo{color:#7a5c12;background:rgba(216,180,90,.22);border:1px solid rgba(216,180,90,.55)}
  .tag.atu{color:#fff;background:var(--brand);border:1px solid var(--brand)}
  @media (prefers-color-scheme: dark){ .tag.novo{color:#e6c877;background:rgba(216,180,90,.14)}
       .tag.atu{background:#3b6bb0;border-color:#3b6bb0} }
  .chev{flex:0 0 auto;color:var(--muted);font-size:1.4rem;font-weight:300}

  /* ---------- Skeleton / estados ---------- */
  .skel{display:flex;flex-direction:column;gap:11px}
  .skel .row{height:78px;border-radius:var(--radius);border:1px solid var(--border);
       background:linear-gradient(90deg,var(--card) 0%,var(--skel) 50%,var(--card) 100%);
       background-size:200% 100%;animation:sh 1.3s infinite linear}
  @keyframes sh{to{background-position:-200% 0}}
  .state{text-align:center;color:var(--muted);padding:56px 20px}
  .state .big{font-size:2.6rem;margin-bottom:10px}

  footer{max-width:1000px;margin:0 auto;padding:22px 20px 46px;color:var(--muted);font-size:.78rem;
       text-align:center;border-top:1px solid var(--border)}
  footer b{color:var(--text)}

  @media(max-width:640px){
    .bar-in{padding:14px 16px;gap:12px}
    .brand-left{padding:8px 14px 8px 10px;gap:12px}
    .stripes{width:56px;height:56px}
    .head-txt h1{font-size:1.25rem}
    .logos{margin-left:0;width:100%;justify-content:flex-start}
    .name{white-space:normal}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="bar-in">
    <div class="brand-left">
      <div class="stripes"></div>
      <div class="head-txt">
        <h1>Planogramas <span class="loja">Loja 365</span></h1>
        <div class="ic-label"><span class="bars"><i></i><i></i><i></i><i></i></span> INTELIGÊNCIA COMERCIAL</div>
      </div>
    </div>
    <div class="logos">
      <!-- Suba um arquivo "logo.png" no repositório e ele aparece aqui automaticamente. -->
      <img id="logo" class="logo-img" src="logo.png" alt="Grupo Pereira · Fort Atacadista"
           onload="this.style.display='block';document.getElementById('wordmark').style.display='none'">
      <div id="wordmark" class="wordmark">
        <span class="grp"><small>GRUPO</small><b>PEREIRA</b></span>
        <span class="sep"></span>
        <span class="fort">Fort<b>ATACADISTA</b></span>
      </div>
    </div>
  </div>
</div>

<div class="toolbar">
  <div class="search">
    <svg class="ic-s" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input type="search" id="q" placeholder="Buscar por planograma ou categoria...">
    <button class="clear" id="clear" aria-label="Limpar busca">×</button>
  </div>
  <span class="count" id="count"></span>
</div>

<main>
  <div id="loader" class="skel">
    <div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div>
  </div>
  <div id="list" class="list"></div>
  <div id="empty" class="state" style="display:none"></div>
</main>

<footer>
  <b>Fort Atacadista</b> · Gestão de Categoria — planogramas atualizados automaticamente
</footer>

<script>
// ==== CONFIGURAÇÃO ====
const BRANCH    = "main";              // branch onde ficam os arquivos
const MANIFESTO = "planogramas.json";  // lista (você controla) com a data/status de cada planograma
const DIAS_SELO = 30;                  // por quantos dias o selo NOVO/ATUALIZADO fica visível
// ======================
// A DATA do card vem do arquivo "planogramas.json" (na raiz do repositório), que VOCÊ controla.
// Assim a data é sempre a data real do planograma, e não a data do upload.
// Formato aceito:
// {
//   "02 - Líquida/Água Mineral.pdf": { "data": "31/08/2026", "status": "atualizado" },
//   "02 - Líquida/Isotônicos.pdf":   { "data": "26/08/2026", "status": "novo" },
//   "05 - Perfumaria/Shampoo.pdf":   "12/09/2026"
// }
// "status" é opcional ("novo" ou "atualizado"). A data pode ser dd/mm/aaaa, dd.mm.aaaa ou aaaa-mm-dd.
// A chave pode ser o caminho completo (pasta/arquivo.pdf) ou só o nome do arquivo.

const listEl=document.getElementById('list'), emptyEl=document.getElementById('empty'),
      loaderEl=document.getElementById('loader'), countEl=document.getElementById('count'),
      qEl=document.getElementById('q'), clearEl=document.getElementById('clear');
let arquivos=[], owner=null, repo=null, manifesto={};

function detectRepo(){
  const host=location.hostname, o=host.split('.')[0];
  const parts=location.pathname.split('/').filter(Boolean);
  return {owner:o, repo: parts.length ? parts[0] : host};
}
function fmtSize(b){ if(b==null)return''; if(b<1024)return b+' B';
  if(b<1048576)return (b/1024).toFixed(0)+' KB'; return (b/1048576).toFixed(1)+' MB'; }
function baseName(path){ const p=path.split('/'); return p[p.length-1]; }
function pad(n){ return String(n).padStart(2,'0'); }
// aceita dd/mm/aaaa, dd.mm.aaaa e aaaa-mm-dd
function parseData(str){
  if(!str) return null; str=String(str).trim(); let m;
  if(m=str.match(/^(\d{4})-(\d{2})-(\d{2})/)) return {ts:Date.UTC(+m[1],+m[2]-1,+m[3]), label:`${m[3]}/${m[2]}/${m[1]}`};
  if(m=str.match(/^(\d{2})[\/.](\d{2})[\/.](\d{4})/)) return {ts:Date.UTC(+m[3],+m[2]-1,+m[1]), label:`${m[1]}/${m[2]}/${m[3]}`};
  return null;
}
// data no próprio nome do arquivo (fallback, se ainda houver)
function parseNomeData(name){ const m=name.match(/^(\d{2})\.(\d{2})\.(\d{4})/);
  return m ? {ts:Date.UTC(+m[3],+m[2]-1,+m[1]), label:`${m[1]}/${m[2]}/${m[3]}`} : null; }
function nomeBonito(name){
  let s=name.replace(/\.pdf$/i,'');
  const i=s.indexOf('@'); if(i>=0) s=s.slice(i+1);     // remove "Categoria @"
  return s.replace(/^\d{2}\.\d{2}\.\d{4}\s*-\s*/,'')
          .replace(/^planograma\s*-\s*/i,'')
          .replace(/\s*-\s*/g,' · ')
          .trim();
}
// Categoria: 1º pelo nome do arquivo ("Categoria @ Produto.pdf"); senão, pela pasta.
function categoria(path, filename){
  const base=filename.replace(/\.pdf$/i,'');
  const i=base.indexOf('@');
  if(i>=0){ const c=base.slice(0,i).trim(); if(c) return {sort:c.toLowerCase(), label:c}; }
  const parts=path.split('/');
  if(parts.length>=2){ const raw=parts[0].trim(); return {sort:raw.toLowerCase(), label:raw}; }
  return {sort:'￿', label:'Geral'};
}
function esc(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function norm(s){ return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
function statusNorm(s){ if(!s) return ''; s=norm(String(s));
  if(s.startsWith('atu')||s.startsWith('upd')) return 'atualizado';
  if(s.startsWith('nov')||s.startsWith('new')) return 'novo'; return ''; }

// procura a entrada do arquivo na lista (por caminho ou por nome)
function buscaManifesto(a){
  if(manifesto[a.rawpath]!=null) return manifesto[a.rawpath];
  if(manifesto[a.name]!=null) return manifesto[a.name];
  const k=Object.keys(manifesto).find(k=>k===a.rawpath || baseName(k)===a.name);
  return k!=null ? manifesto[k] : null;
}
function aplicarManifesto(a){
  const v=buscaManifesto(a);
  let dataStr=null, status='';
  if(typeof v==='string') dataStr=v;
  else if(v && typeof v==='object'){ dataStr=v.data||v.date||v.dt||null; status=v.status||v.selo||''; }
  const d=parseData(dataStr) || parseNomeData(a.name);   // fallback: data no nome
  if(d){ a.ts=d.ts; a.dateLabel=d.label; } else { a.ts=null; a.dateLabel=''; }
  a.status=statusNorm(status);
}

function render(filtro=''){
  const f=norm(filtro.trim());
  const vis=arquivos.filter(a=>norm(nomeBonito(a.name)).includes(f) || norm(a.cat.label).includes(f));
  vis.sort((a,b)=>{
    if(a.cat.sort!==b.cat.sort) return a.cat.sort<b.cat.sort?-1:1;
    const ta=a.ts||0, tb=b.ts||0;
    if(ta!==tb) return tb-ta;
    return a.name.localeCompare(b.name,'pt-BR');
  });
  listEl.innerHTML='';
  countEl.textContent=vis.length+(vis.length===1?' planograma':' planogramas');
  if(!vis.length){
    emptyEl.style.display='block';
    emptyEl.innerHTML=arquivos.length
      ? '<div class="big">🔍</div>Nenhum planograma encontrado para essa busca.'
      : '<div class="big">📭</div>Nenhum planograma publicado ainda.<br>Suba os PDFs no repositório e eles aparecem aqui automaticamente.';
    return;
  }
  emptyEl.style.display='none';
  const counts={}; vis.forEach(a=>counts[a.cat.sort]=(counts[a.cat.sort]||0)+1);
  const agora=Date.now();
  let cur=null;
  for(const a of vis){
    if(a.cat.sort!==cur){
      cur=a.cat.sort;
      const h=document.createElement('div'); h.className='cat';
      h.innerHTML=`<span>${esc(a.cat.label)}</span><span class="line"></span><span class="n">${counts[cur]}</span>`;
      listEl.appendChild(h);
    }
    let tag='';
    if(a.status && (!a.ts || (agora - a.ts) <= DIAS_SELO*86400000)){
      tag = a.status==='atualizado' ? '<span class="tag atu">ATUALIZADO</span>' : '<span class="tag novo">NOVO</span>';
    }
    const link=document.createElement('a');
    link.className='item'; link.href=a.path; link.target='_blank'; link.rel='noopener';
    link.innerHTML=
      '<span class="pdf-ic">PDF</span>'+
      '<span class="meta"><span class="name"></span><span class="subline">'+
        (a.dateLabel?'<span class="date-chip">📅 '+a.dateLabel+'</span>':'')+
        '<span class="size">'+fmtSize(a.size)+'</span>'+
      '</span></span>'+
      tag+
      '<span class="chev">›</span>';
    link.querySelector('.name').textContent=nomeBonito(a.name);
    listEl.appendChild(link);
  }
}

async function carregar(){
  ({owner,repo}=detectRepo());
  const treeApi=`https://api.github.com/repos/${owner}/${repo}/git/trees/${BRANCH}?recursive=1`;
  // lê a lista (planogramas.json) em paralelo — best effort, sem quebrar se não existir
  const mPromise=fetch(MANIFESTO+'?t='+Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({}));
  try{
    const r=await fetch(treeApi,{headers:{'Accept':'application/vnd.github.v3+json'}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data=await r.json();
    try{ manifesto=await mPromise||{}; }catch(e){ manifesto={}; }
    arquivos=(data.tree||[])
      .filter(x=>x.type==='blob' && /\.pdf$/i.test(x.path))
      .map(x=>({ name:baseName(x.path), size:x.size, sha:x.sha, rawpath:x.path,
                 path:x.path.split('/').map(encodeURIComponent).join('/'),
                 cat:categoria(x.path, baseName(x.path)), ts:null, dateLabel:'', status:'' }));
    arquivos.forEach(aplicarManifesto);
    loaderEl.style.display='none';
    render(qEl.value);
  }catch(e){
    loaderEl.style.display='none';
    emptyEl.style.display='block';
    emptyEl.innerHTML='<div class="big">⚠️</div>Não consegui carregar a lista.<br>'+
      'Confira se o repositório é <b>público</b> e se os PDFs já foram enviados.';
  }
}

qEl.addEventListener('input',e=>{ clearEl.style.display=e.target.value?'block':'none'; render(e.target.value); });
clearEl.addEventListener('click',()=>{ qEl.value=''; clearEl.style.display='none'; render(''); qEl.focus(); });
carregar();
</script>
</body>
</html>
